<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ardenne Group — Board Report</title>
<style>
:root{
  --paper:#FFFFFF; --panel:#F7F7F5; --ink:#14171A; --ink2:#42484F; --mid:#6D747C;
  --muted:#9BA1A9; --rule:#E4E4E0; --rule2:#EFEFEC;
  --up:#1F6B4F; --dn:#A03328; --g1:#14171A; --g2:#4E555D; --g3:#868D95; --g4:#BEC3C9; --g5:#DDE0E3;
  --sans:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#C9CBC6;font-family:var(--sans);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#canvas{width:1280px;height:720px;transform-origin:center center;background:var(--paper);
  display:flex;flex-direction:column;box-shadow:0 6px 34px rgba(30,32,28,.30);position:relative}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.lbl{font-size:8.5px;letter-spacing:1.7px;text-transform:uppercase;color:var(--muted);font-weight:600}

/* masthead */
#mast{height:58px;flex:0 0 58px;display:flex;align-items:center;padding:0 32px;border-bottom:1px solid var(--ink);gap:26px}
.wordmark{font-size:13px;font-weight:700;letter-spacing:3.4px;color:var(--ink)}
.docline{font-size:10px;color:var(--mid);letter-spacing:.3px;border-left:1px solid var(--rule);padding-left:16px}
.sp{flex:1}
.pnav{display:flex;gap:20px}
.pnav button{background:none;border:0;font-family:var(--sans);font-size:11px;color:var(--muted);cursor:pointer;
  padding:3px 0;border-bottom:1.5px solid transparent;letter-spacing:.2px}
.pnav button:hover{color:var(--ink2)}
.pnav button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}

/* period bar */
#pbar{height:34px;flex:0 0 34px;display:flex;align-items:center;padding:0 32px;gap:16px;border-bottom:1px solid var(--rule)}
.per{background:none;border:0;font-family:var(--sans);font-size:10px;color:var(--muted);cursor:pointer;letter-spacing:.6px;padding:2px 0}
.per:hover{color:var(--ink2)}
.per.on{color:var(--ink);font-weight:600}
.dot{width:3px;height:3px;border-radius:50%;background:var(--rule);flex:0 0 3px}
.fpill{font-size:9.5px;color:var(--ink2);letter-spacing:.3px;border:1px solid var(--rule);padding:3px 9px;border-radius:2px;background:var(--panel)}
.fpill b{font-weight:600;color:var(--ink)}
.clr{background:none;border:0;font-family:var(--sans);font-size:9.5px;color:var(--muted);cursor:pointer;letter-spacing:.4px}
.clr:hover{color:var(--dn)}

/* page */
#page{flex:1;padding:20px 32px 14px;overflow:hidden;display:flex;flex-direction:column}
.rule{height:1px;background:var(--rule);flex:0 0 1px}
.mb18{margin-bottom:18px}.mb20{margin-bottom:20px}.mt18{margin-top:18px}

/* commentary */
.note{font-family:var(--serif);font-size:18.5px;line-height:1.56;color:var(--ink);max-width:1010px;letter-spacing:-.1px}
.note em{font-style:normal;font-weight:700}
.note .pos{color:var(--up);font-style:normal}
.note .neg{color:var(--dn);font-style:normal}
.noteb{min-height:60px}

/* kpi band */
.kband{display:flex}
.kcol{flex:1;padding:0 20px;border-left:1px solid var(--rule2)}
.kcol:first-child{padding-left:0;border-left:0}
.kcol:last-child{padding-right:0}
.kcol .v{font-size:29px;font-weight:500;color:var(--ink);letter-spacing:-1.3px;line-height:1;margin-top:9px}
.kcol .vr{display:flex;align-items:baseline;gap:7px}
.kcol .d{font-size:10.5px;font-weight:600;letter-spacing:-.1px}
.kcol .det{font-size:9.5px;color:var(--mid);margin-top:8px;letter-spacing:.05px;line-height:1.5}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--muted)}

/* panels */
.cols{display:flex;gap:26px;flex:1;min-height:0}
.pnl{display:flex;flex-direction:column;min-width:0}
.phd{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
.phd .sub{font-size:9px;color:var(--muted);letter-spacing:.2px;text-transform:none;font-weight:400}
.phd .rt{margin-left:auto;font-size:8.5px;color:#B7BCC2;letter-spacing:.3px}

/* table */
table{width:100%;border-collapse:collapse;font-size:10.5px}
th{text-align:right;font-weight:600;color:var(--muted);font-size:8px;letter-spacing:1.1px;text-transform:uppercase;
  padding:0 6px 6px;border-bottom:1px solid var(--ink);white-space:nowrap}
th:first-child{text-align:left;padding-left:0}
th:last-child{padding-right:0}
td{padding:6px;text-align:right;color:var(--ink2);border-bottom:1px solid var(--rule2);white-space:nowrap}
td:first-child{text-align:left;color:var(--ink);font-weight:500;padding-left:0}
td:last-child{padding-right:0}
tr.r{cursor:pointer}
tr.r:hover td{background:var(--panel)}
tr.r.dim td{opacity:.34}
tr.r.sel td{background:#F2F2EF}
tr.tot td{font-weight:600;color:var(--ink);border-top:1px solid var(--ink);border-bottom:0;padding-top:7px}
.dg{display:inline-block;width:12px;text-align:center;color:var(--muted);opacity:0;font-size:11px}
tr.r:hover .dg{opacity:1}
svg{display:block}
svg .hit{cursor:pointer}
svg .dimd{opacity:.26}
#tip{position:fixed;pointer-events:none;background:#14171A;color:#fff;font-size:10.5px;padding:7px 10px;border-radius:2px;
  opacity:0;transition:opacity .1s;z-index:50;line-height:1.6;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.28)}
#tip b{font-weight:600}
.backl{background:none;border:0;font-family:var(--sans);font-size:10.5px;color:var(--mid);cursor:pointer;letter-spacing:.3px;padding:0}
.backl:hover{color:var(--ink)}
.dhd{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px}
.dhd .nm{font-size:20px;font-weight:600;color:var(--ink);letter-spacing:-.6px;line-height:1}
.dhd .mt{font-size:9.5px;color:var(--mid);margin-top:6px;letter-spacing:.2px}
.foot{font-size:8px;color:#C2C6C9;letter-spacing:.4px;padding-top:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="stage"><div id="canvas">
  <div id="mast">
    <div class="wordmark">ARDENNE GROUP</div>
    <div class="docline">Board Report &middot; Confidential</div>
    <div class="sp"></div>
    <div class="pnav">
      <button data-page="sum" class="on">Group summary</button>
      <button data-page="drv">Value drivers</button>
    </div>
  </div>
  <div id="pbar">
    <span class="lbl">Period</span>
    <span id="fPer" style="display:flex;gap:16px;align-items:center"></span>
    <span class="dot"></span>
    <span id="fCtx" style="display:flex;gap:8px"></span>
    <span class="sp"></span>
    <span id="fCmp" style="font-size:9.5px;color:var(--muted);letter-spacing:.3px"></span>
    <button class="clr" id="btnReset">Reset</button>
  </div>
  <div id="page"></div>
</div></div>
<div id="tip"></div>

<script>
/* ---------- utils ---------- */
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mb(48211), j=(a,b)=>a+R()*(b-a);
const mn=(v,d)=>{const s=v<0?'\u2212':'';d=d===undefined?1:d;return s+'\u20ac'+(Math.abs(v)/1e6).toFixed(d)+'m'};
const kn=v=>(v<0?'\u2212':'')+'\u20ac'+(Math.abs(v)/1e3).toFixed(0)+'k';
const pc=(v,d)=>(v*100).toFixed(d===undefined?1:d)+'%';
const bps=v=>Math.abs(v)<5e-5?'flat':(v>0?'+':'\u2212')+Math.abs(Math.round(v*10000))+'bps';
const moved=v=>Math.abs(v)<5e-5?'held at':(v>0?'expanded':'compressed');
const lst=a=>a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const N=v=>Math.round(v).toLocaleString('en-US');
const sgp=(v,d)=>(v>0?'+':'\u2212')+pc(Math.abs(v),d);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ---------- model ---------- */
const CO=[
 {id:'vc',n:'Vestra Care',      s:'Healthcare services', rev:96e6, mg:.171,gr:.094,cap:.041,c:'#14171A'},
 {id:'lr',n:'Lumen Retail',     s:'Specialty retail',    rev:118e6,mg:.081,gr:.021,cap:.028,c:'#4E555D'},
 {id:'nl',n:'Northgate Logistics',s:'Contract logistics',rev:74e6, mg:.124,gr:.048,cap:.062,c:'#868D95'},
 {id:'ad',n:'Ardenne Digital',  s:'Data & software',     rev:38e6, mg:.223,gr:.241,cap:.035,c:'#BEC3C9'},
 {id:'cf',n:'Calder Foods',     s:'Branded food',        rev:61e6, mg:.093,gr:-.032,cap:.049,c:'#DDE0E3'}
];
const C=Object.fromEntries(CO.map(c=>[c.id,c]));
const YRS=[2023,2024,2025];
const SEAS=[.93,.90,1.05,1.01,1.04,1.07,.94,.78,1.06,1.10,1.07,1.05];
const F=[];
YRS.forEach((y,yi)=>CO.forEach(co=>{
  const base=co.rev*Math.pow(1+co.gr,yi-1);
  const lvT=j(1.35,2.75)*(1-(yi-1)*.07);          /* target net debt / EBITDA */
  const netDebt=base*co.mg*lvT;                   /* point in time, stable across periods */
  const perHead=j(118000,182000);
  for(let m=0;m<12;m++){
    const rev=base*(SEAS[m]/12)*j(.96,1.04);
    const mg=co.mg*(1+(yi-1)*j(-.055,.045))*j(.95,1.05);
    const eb=rev*mg, capex=rev*co.cap*j(.7,1.3);
    F.push({y,m,co:co.id,rev,eb,capex,
      ocf:eb*j(.70,.94), fcf:eb*j(.70,.94)-capex,
      nd:netDebt, hc:Math.round(base/perHead)});
  }
}));

/* ---------- state ---------- */
const S={page:'sum',y:2025,per:'FY',co:null,mo:null,drill:null,from:'sum'};
const PER={FY:[0,11],H1:[0,5],H2:[6,11],Q4:[9,11]};
const PERL={FY:'Full year',H1:'First half',H2:'Second half',Q4:'Fourth quarter'};
const inP=m=>{const r=PER[S.per];return m>=r[0]&&m<=r[1]};
function f(y,o){o=o||{};return F.filter(x=>x.y===y&&inP(x.m)
  &&(o.allCo||!S.co||x.co===o.co||x.co===S.co)&&(o.allMo||S.mo===null||x.m===S.mo))}
const sm=(a,k)=>a.reduce((x,r)=>x+r[k],0);
function agg(a){
  const rev=sm(a,'rev'),eb=sm(a,'eb'),fcf=sm(a,'fcf'),capex=sm(a,'capex');
  const last=a.length?Math.max(...a.map(x=>x.m)):0;
  const tail=a.filter(x=>x.m===last);
  const nd=sm(tail,'nd'),hc=sm(tail,'hc');
  const ann=rev*(12/(PER[S.per][1]-PER[S.per][0]+1));
  const ebAnn=eb*(12/(PER[S.per][1]-PER[S.per][0]+1));
  return{rev,eb,fcf,capex,nd,hc,mg:rev?eb/rev:0,conv:eb?fcf/eb:0,
    lev:ebAnn?nd/ebAnn:0, rpf:hc?ann/hc:0}
}

/* ---------- narrative ---------- */
function narrative(kind){
  const c=agg(f(S.y)),p=agg(f(S.y-1));
  const g=p.rev?(c.rev-p.rev)/p.rev:0, dm=c.mg-p.mg;
  const per=CO.map(co=>{const a=agg(F.filter(x=>x.y===S.y&&inP(x.m)&&x.co===co.id)),
    b=agg(F.filter(x=>x.y===S.y-1&&inP(x.m)&&x.co===co.id));
    return{co,d:a.rev-b.rev,g:b.rev?(a.rev-b.rev)/b.rev:0,mg:a.mg,dm:a.mg-b.mg}}).sort((x,y)=>y.d-x.d);
  const top=per[0],bot=per[per.length-1];
  const W=(t,cl)=>`<span class="${cl}">${t}</span>`;
  const gw=g>=0?'ahead of':'behind';
  const scope=S.co?C[S.co].n:'The group';
  if(kind==='drv'){
    const win=per.filter(x=>x.d>0),los=per.filter(x=>x.d<=0);
    const wt=win.length?`${W('<em>'+lst(win.map(x=>x.co.n))+'</em>','')} added ${mn(win.reduce((a,x)=>a+x.d,0))}${win.length>1?' between them':''}`:'no operating company grew';
    const lt=los.length?`${W('<em>'+lst(los.map(x=>x.co.n))+'</em>','')} gave back ${mn(Math.abs(los.reduce((a,x)=>a+x.d,0)))}`:'every company grew';
    const head=3-c.lev;
    return `Growth was ${win.length<=2?'concentrated':'broadly based'}: ${wt}, while ${lt}.
      Margin ${moved(dm)}${Math.abs(dm)<5e-5?'':' '+W(bps(dm).replace(/^[+\u2212]/,''),dm>=0?'pos':'neg')+' to '+pc(c.mg)};
      free cash conversion of ${pc(c.conv,0)} of EBITDA left leverage at <em>${c.lev.toFixed(2)}&times;</em>
      against a covenant of 3.00&times;, ${head>0?`leaving ${head.toFixed(2)}&times; of headroom`:W('placing the group in breach','neg')}.`
  }
  return `${scope} delivered revenue of <em>${mn(c.rev)}</em> in ${PERL[S.per].toLowerCase()} ${S.y},
    ${W(sgp(g),g>=0?'pos':'neg')} ${gw} prior year${S.co?'':`, led by <em>${top.co.n}</em> at ${sgp(top.g,0)}
    and held back by <em>${bot.co.n}</em> at ${sgp(bot.g,0)}`}.
    EBITDA margin ${moved(dm)}${Math.abs(dm)<5e-5?'':' '+W(bps(dm).replace(/^[+\u2212]/,''),dm>=0?'pos':'neg')+' to <em>'+pc(c.mg)+'</em>'},
    and free cash flow of ${mn(c.fcf)} represented ${pc(c.conv,0)} conversion.`
}

/* ---------- charts ---------- */
function ticks(max,n){n=n||4;const raw=max/n,mag=Math.pow(10,Math.floor(Math.log10(raw)||0));
  const st=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw)||10*mag;
  const o=[];for(let v=0;v<=st*n+1e-9;v+=st){o.push(v);if(v>=max)break}return o}

function barPct(w,h,data){
  const m={t:14,r:44,b:22,l:46},iw=w-m.l-m.r,ih=h-m.t-m.b;
  const max=Math.max(...data.map(d=>d.a))*1.16||1,tk=ticks(max),top=tk[tk.length-1];
  const Y=v=>m.t+ih-(v/top)*ih;
  const step=iw/data.length,bw=Math.min(24,step*.46);
  const pmax=Math.max(...data.map(d=>d.p))*1.6||1,pmin=Math.min(...data.map(d=>d.p))*.55;
  const Y2=v=>m.t+ih-((v-pmin)/((pmax-pmin)||1))*ih;
  let s=`<svg width="${w}" height="${h}">`;
  tk.forEach(t=>{s+=`<line x1="${m.l}" y1="${Y(t).toFixed(1)}" x2="${m.l+iw}" y2="${Y(t).toFixed(1)}" stroke="${t?'#F1F1EE':'#D6D6D2'}"/>`
   +`<text x="${m.l-8}" y="${Y(t)+3.5}" text-anchor="end" font-size="8.5" fill="#A8ADB3" class="tnum">${t?mn(t,0):0}</text>`});
  data.forEach((d,i)=>{const cx=m.l+step*i+step/2,dim=S.mo!==null&&S.mo!==d.m;
    s+=`<rect class="hit ${dim?'dimd':''}" x="${(cx-bw/2).toFixed(1)}" y="${Y(d.a).toFixed(1)}" width="${bw}" height="${Math.max(0,m.t+ih-Y(d.a)).toFixed(1)}" fill="#14171A" data-f="mo:${d.m}" data-tip="<b>${d.l} ${S.y}</b><br>Revenue ${mn(d.a,2)}<br>EBITDA margin ${pc(d.p)}<br>Prior year ${mn(d.b,2)}"/>`;
    s+=`<text x="${cx}" y="${h-7}" text-anchor="middle" font-size="8.5" fill="#A8ADB3">${d.l}</text>`});
  let p='';data.forEach((d,i)=>{const cx=m.l+step*i+step/2;p+=(i?'L':'M')+cx.toFixed(1)+','+Y2(d.p).toFixed(1)});
  s+=`<path d="${p}" fill="none" stroke="#A03328" stroke-width="1.4"/>`;
  data.forEach((d,i)=>{const cx=m.l+step*i+step/2;
    s+=`<circle class="hit" cx="${cx.toFixed(1)}" cy="${Y2(d.p).toFixed(1)}" r="2.3" fill="#fff" stroke="#A03328" stroke-width="1.3" data-tip="<b>${d.l} ${S.y}</b><br>EBITDA margin ${pc(d.p)}<br>Revenue ${mn(d.a,2)}"/>`});
  s+=`<text x="${w-4}" y="${Y2(data[data.length-1].p)+3.5}" text-anchor="end" font-size="8.5" fill="#A03328" class="tnum">${pc(data[data.length-1].p,0)}</text>`;
  return s+'</svg>'
}

function bridge(w,h,steps){
  const m={t:18,r:6,b:30,l:52},iw=w-m.l-m.r,ih=h-m.t-m.b;
  let run=0;const pt=steps.map(s=>{if(s.t){const o={f:0,to:s.v};run=s.v;return o}const o={f:run,to:run+s.v};run+=s.v;return o});
  const vals=pt.flatMap(p=>[p.f,p.to]);
  const hi=Math.max(...vals)*1.04,lo=Math.min(...vals)*.92;
  const Y=v=>m.t+ih-((v-lo)/((hi-lo)||1))*ih;
  const step=iw/steps.length,bw=Math.min(46,step*.56);
  let s=`<svg width="${w}" height="${h}">`;
  steps.forEach((st,i)=>{
    const p=pt[i],cx=m.l+step*i+step/2;
    const y1=Y(Math.max(p.f,p.to)),y2=Y(Math.min(p.f,p.to));
    const col=st.t?'#14171A':(st.v<0?'#A03328':'#1F6B4F');
    const dim=S.co&&st.id&&S.co!==st.id;
    s+=`<rect class="hit ${dim?'dimd':''}" x="${(cx-bw/2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw}" height="${Math.max(1.5,y2-y1).toFixed(1)}" fill="${col}"
      ${st.id?`data-f="co:${st.id}"`:''} data-tip="<b>${st.l}</b><br>${st.t?mn(st.v,2):(st.v>0?'+':'\u2212')+mn(Math.abs(st.v),2)}${st.x?'<br>'+st.x:''}"/>`;
    if(i<steps.length-1)s+=`<line x1="${(cx+bw/2).toFixed(1)}" y1="${Y(p.to).toFixed(1)}" x2="${(m.l+step*(i+1)+step/2-bw/2).toFixed(1)}" y2="${Y(p.to).toFixed(1)}" stroke="#D8D8D4" stroke-dasharray="2 2"/>`;
    s+=`<text x="${cx}" y="${(y1-6).toFixed(1)}" text-anchor="middle" font-size="9" fill="${st.t?'#14171A':col}" class="tnum">${st.t?mn(st.v,1):(st.v>0?'+':'\u2212')+(Math.abs(st.v)/1e6).toFixed(1)}</text>`;
    st.l.split('\n').forEach((ln,k)=>{s+=`<text x="${cx}" y="${h-16+k*10}" text-anchor="middle" font-size="8.5" fill="#8A9098">${ln}</text>`});
  });
  return s+'</svg>'
}

function marginBar(w,h,data){
  const lw=132,rw=54,m={t:4,b:4},ih=h-m.t-m.b,iw=w-lw-rw;
  const max=Math.max(...data.map(d=>Math.max(d.v,d.p)))*1.12||1;
  const rh=ih/data.length,bh=Math.min(13,rh*.42);
  let s=`<svg width="${w}" height="${h}">`;
  data.forEach((d,i)=>{
    const y=m.t+rh*i+rh/2,bl=(d.v/max)*iw,pl=(d.p/max)*iw;
    const dim=S.co&&S.co!==d.id;
    s+=`<g class="hit ${dim?'dimd':''}" data-f="co:${d.id}" data-tip="<b>${d.l}</b><br>EBITDA margin ${pc(d.v)}<br>Prior year ${pc(d.p)}<br>Movement ${bps(d.v-d.p)}">`;
    s+=`<rect x="0" y="${(y-rh/2).toFixed(1)}" width="${w}" height="${rh.toFixed(1)}" fill="transparent"/>`;
    s+=`<text x="${lw-12}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#42484F">${esc(d.l)}</text>`;
    s+=`<rect x="${lw}" y="${(y-bh/2).toFixed(1)}" width="${Math.max(1,bl).toFixed(1)}" height="${bh}" fill="${d.c}"/>`;
    s+=`<line x1="${(lw+pl).toFixed(1)}" y1="${(y-bh/2-3).toFixed(1)}" x2="${(lw+pl).toFixed(1)}" y2="${(y+bh/2+3).toFixed(1)}" stroke="#14171A" stroke-width="1.2"/>`;
    s+=`<text x="${w-30}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="#42484F" class="tnum">${pc(d.v)}</text>`;
    s+=`<text x="${w-2}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="8.5" fill="${d.v-d.p>=0?'#1F6B4F':'#A03328'}" class="tnum">${bps(d.v-d.p)}</text></g>`});
  return s+'</svg>'
}

function spark(w,h,vals){
  const mx=Math.max(...vals),mn=Math.min(...vals);
  const X=i=>i*(w/((vals.length-1)||1)),Y=v=>h-1.5-((v-mn)/((mx-mn)||1))*(h-3);
  let p='';vals.forEach((v,i)=>p+=(i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1));
  return `<svg width="${w}" height="${h}" style="display:inline-block;vertical-align:middle"><path d="${p}" fill="none" stroke="#868D95" stroke-width="1"/><circle cx="${X(vals.length-1).toFixed(1)}" cy="${Y(vals[vals.length-1]).toFixed(1)}" r="1.6" fill="#14171A"/></svg>`
}

function kcol(k,val,cur,ref,det,o){
  o=o||{};const d=(ref&&isFinite(ref)&&Math.abs(ref)>1e-9)?(cur-ref)/Math.abs(ref):0;
  const cls=Math.abs(d)<.002?'fl':(d>0?(o.inv?'dn':'up'):(o.inv?'up':'dn'));
  const ar=Math.abs(d)<.002?'':(d>0?'\u25b2 ':'\u25bc ');
  return `<div class="kcol"><div class="lbl">${k}</div>
    <div class="vr"><div class="v tnum">${val}</div><div class="d ${cls} tnum">${o.dtxt||ar+pc(Math.abs(d))}</div></div>
    <div class="det tnum">${det}</div></div>`
}

/* ---------- months ---------- */
function mons(){const r=PER[S.per],o=[];for(let m=r[0];m<=r[1];m++)o.push(m);return o}
function series(){return mons().map(m=>{
  const a=F.filter(x=>x.y===S.y&&x.m===m&&(!S.co||x.co===S.co));
  const b=F.filter(x=>x.y===S.y-1&&x.m===m&&(!S.co||x.co===S.co));
  const rev=sm(a,'rev');return{m,l:MON[m],a:rev,b:sm(b,'rev'),p:rev?sm(a,'eb')/rev:0}})}

/* ---------- pages ---------- */
function pageSum(){
  const c=agg(f(S.y)),p=agg(f(S.y-1));
  const rows=CO.map(co=>{
    const a=agg(F.filter(x=>x.y===S.y&&inP(x.m)&&x.co===co.id)),
          b=agg(F.filter(x=>x.y===S.y-1&&inP(x.m)&&x.co===co.id));
    const sp=mons().map(m=>sm(F.filter(x=>x.y===S.y&&x.m===m&&x.co===co.id),'rev'));
    return{co,a,b,sp,g:b.rev?(a.rev-b.rev)/b.rev:0,dm:a.mg-b.mg}}).sort((x,y)=>y.a.rev-x.a.rev);
  const tot=agg(f(S.y,{allCo:true})),totP=agg(f(S.y-1,{allCo:true}));
  return `
  <div class="noteb mb20"><div class="note">${narrative('sum')}</div></div>
  <div class="rule mb18"></div>
  <div class="kband">
    ${kcol('Revenue',mn(c.rev),c.rev,p.rev,`Prior year ${mn(p.rev)} &nbsp;|&nbsp; Variance ${(c.rev-p.rev>=0?'+':'\u2212')+mn(Math.abs(c.rev-p.rev))}`)}
    ${kcol('EBITDA',mn(c.eb),c.eb,p.eb,`Margin ${pc(c.mg)} &nbsp;|&nbsp; Prior year ${pc(p.mg)} &nbsp;|&nbsp; ${bps(c.mg-p.mg)}`)}
    ${kcol('Free cash flow',mn(c.fcf),c.fcf,p.fcf,`Conversion ${pc(c.conv,0)} of EBITDA &nbsp;|&nbsp; Capex ${mn(c.capex)}`)}
    ${kcol('Net debt / EBITDA',c.lev.toFixed(2)+'\u00d7',c.lev,p.lev,`Net debt ${mn(c.nd)} &nbsp;|&nbsp; Covenant 3.00\u00d7 &nbsp;|&nbsp; Headroom ${(3-c.lev).toFixed(2)}\u00d7`,{inv:true})}
    ${kcol('Revenue per FTE',kn(c.rpf),c.rpf,p.rpf,`Headcount ${N(c.hc)} &nbsp;|&nbsp; Prior year ${kn(p.rpf)}`)}
  </div>
  <div class="rule mt18 mb18"></div>
  <div class="cols">
    <div class="pnl" style="width:734px">
      <div class="phd"><span class="lbl">Revenue and EBITDA margin</span><span class="sub">monthly, ${S.y}</span>
        <span class="rt">click a column to filter</span></div>
      ${barPct(734,286,series())}
    </div>
    <div class="pnl" style="flex:1">
      <div class="phd"><span class="lbl">By operating company</span>
        <span class="rt">right-click to drill through</span></div>
      <table><thead><tr><th>Company</th><th>Revenue</th><th>Growth</th><th>Margin</th><th>Movement</th><th></th></tr></thead><tbody>
      ${rows.map(r=>{const cl=S.co?(S.co===r.co.id?'sel':'dim'):'';
        return `<tr class="r ${cl}" data-f="co:${r.co.id}" data-drill="co:${r.co.id}">
        <td>${r.co.n}<span class="dg">\u203a</span></td>
        <td class="tnum">${mn(r.a.rev)}</td>
        <td class="tnum ${r.g>=0?'up':'dn'}">${sgp(r.g)}</td>
        <td class="tnum">${pc(r.a.mg)}</td>
        <td class="tnum ${r.dm>=0?'up':'dn'}">${bps(r.dm)}</td>
        <td style="padding-right:0">${spark(46,13,r.sp)}</td></tr>`}).join('')}
      <tr class="tot"><td>Group</td><td class="tnum">${mn(tot.rev)}</td>
        <td class="tnum ${tot.rev>=totP.rev?'up':'dn'}">${sgp((tot.rev-totP.rev)/totP.rev)}</td>
        <td class="tnum">${pc(tot.mg)}</td><td class="tnum ${tot.mg>=totP.mg?'up':'dn'}">${bps(tot.mg-totP.mg)}</td><td></td></tr>
      </tbody></table>
    </div>
  </div>
  <div class="foot">Synthetic demonstration data &middot; not actual company figures</div>`
}

function pageDrv(){
  const c=agg(f(S.y,{allCo:true})),p=agg(f(S.y-1,{allCo:true}));
  const deltas=CO.map(co=>{
    const a=agg(F.filter(x=>x.y===S.y&&inP(x.m)&&x.co===co.id)),
          b=agg(F.filter(x=>x.y===S.y-1&&inP(x.m)&&x.co===co.id));
    return{id:co.id,l:co.n.split(' ')[0]+'\n'+(co.n.split(' ')[1]||''),v:a.rev-b.rev,
      x:`${mn(b.rev)} \u2192 ${mn(a.rev)}`}}).sort((x,y)=>y.v-x.v);
  const steps=[{l:String(S.y-1)+'\nrevenue',v:p.rev,t:1},...deltas,{l:String(S.y)+'\nrevenue',v:c.rev,t:1}];
  const mg=CO.map(co=>{
    const a=agg(F.filter(x=>x.y===S.y&&inP(x.m)&&x.co===co.id)),
          b=agg(F.filter(x=>x.y===S.y-1&&inP(x.m)&&x.co===co.id));
    return{id:co.id,l:co.n,v:a.mg,p:b.mg,c:co.c}}).sort((x,y)=>y.v-x.v);
  const cash=CO.map(co=>{
    const a=agg(F.filter(x=>x.y===S.y&&inP(x.m)&&x.co===co.id));
    return{co,a}}).sort((x,y)=>y.a.fcf-x.a.fcf);
  return `
  <div class="noteb mb20"><div class="note">${narrative('drv')}</div></div>
  <div class="rule mb18"></div>
  <div class="pnl" style="margin-bottom:16px">
    <div class="phd"><span class="lbl">Revenue bridge</span><span class="sub">${S.y-1} to ${S.y}, ${PERL[S.per].toLowerCase()}, &euro;m</span>
      <span class="rt">click a bar to filter</span></div>
    ${bridge(1216,214,steps)}
  </div>
  <div class="rule mb18"></div>
  <div class="cols">
    <div class="pnl" style="width:596px">
      <div class="phd"><span class="lbl">EBITDA margin</span><span class="sub">bar current, tick prior year</span></div>
      ${marginBar(596,168,mg)}
    </div>
    <div class="pnl" style="flex:1">
      <div class="phd"><span class="lbl">Cash and leverage</span>
        <span class="rt">right-click to drill through</span></div>
      <table><thead><tr><th>Company</th><th>EBITDA</th><th>Capex</th><th>Free cash</th><th>Conv.</th><th>Net debt</th><th>Lev.</th></tr></thead><tbody>
      ${cash.map(r=>{const cl=S.co?(S.co===r.co.id?'sel':'dim'):'';
        return `<tr class="r ${cl}" data-f="co:${r.co.id}" data-drill="co:${r.co.id}">
        <td>${r.co.n}<span class="dg">\u203a</span></td>
        <td class="tnum">${mn(r.a.eb)}</td><td class="tnum">${mn(r.a.capex)}</td>
        <td class="tnum ${r.a.fcf>=0?'':'dn'}">${mn(r.a.fcf)}</td>
        <td class="tnum">${pc(r.a.conv,0)}</td><td class="tnum">${mn(r.a.nd)}</td>
        <td class="tnum ${r.a.lev>3?'dn':''}">${r.a.lev.toFixed(2)}\u00d7</td></tr>`}).join('')}
      <tr class="tot"><td>Group</td><td class="tnum">${mn(c.eb)}</td><td class="tnum">${mn(c.capex)}</td>
        <td class="tnum">${mn(c.fcf)}</td><td class="tnum">${pc(c.conv,0)}</td><td class="tnum">${mn(c.nd)}</td>
        <td class="tnum">${c.lev.toFixed(2)}\u00d7</td></tr>
      </tbody></table>
    </div>
  </div>
  <div class="foot">Synthetic demonstration data &middot; not actual company figures</div>`
}

function pageDrill(){
  const co=C[S.drill];
  const cur=F.filter(x=>x.y===S.y&&inP(x.m)&&x.co===co.id),pre=F.filter(x=>x.y===S.y-1&&inP(x.m)&&x.co===co.id);
  const c=agg(cur),p=agg(pre);
  const ser=mons().map(m=>{const a=F.filter(x=>x.y===S.y&&x.m===m&&x.co===co.id),
    b=F.filter(x=>x.y===S.y-1&&x.m===m&&x.co===co.id);
    const rev=sm(a,'rev');return{m,l:MON[m],a:rev,b:sm(b,'rev'),p:rev?sm(a,'eb')/rev:0}});
  const g=p.rev?(c.rev-p.rev)/p.rev:0;
  return `
  <div class="dhd">
    <button class="backl" id="btnBack">&lsaquo; ${S.from==='sum'?'Group summary':'Value drivers'}</button>
    <div style="flex:1"><div class="nm">${co.n}</div>
      <div class="mt">${co.s} &middot; ${PERL[S.per]} ${S.y} &middot; compared with ${S.y-1}</div></div>
  </div>
  <div class="noteb mb20"><div class="note">${co.n} contributed <em>${mn(c.rev)}</em> of revenue,
    <span class="${g>=0?'pos':'neg'}">${sgp(g)}</span> against prior year, at an EBITDA margin of <em>${pc(c.mg)}</em>
    (${bps(c.mg-p.mg)}). Free cash flow of ${mn(c.fcf)} converted ${pc(c.conv,0)} of EBITDA,
    with net debt of ${mn(c.nd)} representing ${c.lev.toFixed(2)}&times; annualised earnings.</div></div>
  <div class="rule mb18"></div>
  <div class="kband">
    ${kcol('Revenue',mn(c.rev),c.rev,p.rev,`Prior year ${mn(p.rev)} &nbsp;|&nbsp; Variance ${(c.rev-p.rev>=0?'+':'\u2212')+mn(Math.abs(c.rev-p.rev))}`)}
    ${kcol('EBITDA',mn(c.eb),c.eb,p.eb,`Margin ${pc(c.mg)} &nbsp;|&nbsp; Prior year ${pc(p.mg)} &nbsp;|&nbsp; ${bps(c.mg-p.mg)}`)}
    ${kcol('Free cash flow',mn(c.fcf),c.fcf,p.fcf,`Conversion ${pc(c.conv,0)} &nbsp;|&nbsp; Capex ${mn(c.capex)}`)}
    ${kcol('Net debt / EBITDA',c.lev.toFixed(2)+'\u00d7',c.lev,p.lev,`Net debt ${mn(c.nd)} &nbsp;|&nbsp; Covenant 3.00\u00d7`,{inv:true})}
    ${kcol('Revenue per FTE',kn(c.rpf),c.rpf,p.rpf,`Headcount ${N(c.hc)} &nbsp;|&nbsp; Prior year ${kn(p.rpf)}`)}
  </div>
  <div class="rule mt18 mb18"></div>
  <div class="cols">
    <div class="pnl" style="width:734px">
      <div class="phd"><span class="lbl">Revenue and EBITDA margin</span><span class="sub">monthly, ${S.y}</span></div>
      ${barPct(734,222,ser)}
    </div>
    <div class="pnl" style="flex:1">
      <div class="phd"><span class="lbl">Monthly detail</span></div>
      <table><thead><tr><th>Month</th><th>Revenue</th><th>vs PY</th><th>EBITDA</th><th>Margin</th></tr></thead><tbody>
      ${ser.map(x=>{const eb=x.a*x.p,d=x.b?(x.a-x.b)/x.b:0;
        return `<tr class="r"><td>${x.l} ${S.y}</td><td class="tnum">${mn(x.a,2)}</td>
        <td class="tnum ${d>=0?'up':'dn'}">${sgp(d,0)}</td><td class="tnum">${mn(eb,2)}</td>
        <td class="tnum">${pc(x.p)}</td></tr>`}).join('')}
      </tbody></table>
    </div>
  </div>
  <div class="foot">Synthetic demonstration data &middot; not actual company figures</div>`
}

/* ---------- render ---------- */
const $=s=>document.querySelector(s);
function render(){
  $('#fPer').innerHTML=[['FY','Full year'],['H1','H1'],['H2','H2'],['Q4','Q4']]
    .map(([k,l])=>`<button class="per ${S.per===k?'on':''}" data-per="${k}">${l}</button>`).join('')
    +'<span style="width:8px"></span>'+[2025,2024].map(y=>`<button class="per ${S.y===y?'on':''}" data-y="${y}">${y}</button>`).join('');
  document.querySelectorAll('.pnav button').forEach(b=>b.classList.toggle('on',b.dataset.page===S.page));
  const cx=[];
  if(S.co)cx.push(`<span class="fpill">${C[S.co].n}</span>`);
  if(S.mo!==null)cx.push(`<span class="fpill">${MON[S.mo]} <b>${S.y}</b></span>`);
  $('#fCtx').innerHTML=cx.join('');
  $('#fCmp').textContent='Compared with '+PERL[S.per].toLowerCase()+' '+(S.y-1);
  $('#page').innerHTML=S.page==='sum'?pageSum():S.page==='drv'?pageDrv():pageDrill();
}

/* ---------- interactions ---------- */
const tip=$('#tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');
  if(!t){tip.style.opacity=0;return}tip.innerHTML=t.getAttribute('data-tip');tip.style.opacity=1});
document.addEventListener('mousemove',e=>{if(tip.style.opacity==='1'){
  let x=e.clientX+14,y=e.clientY+16;
  if(x+tip.offsetWidth>innerWidth-8)x=e.clientX-tip.offsetWidth-14;
  if(y+tip.offsetHeight>innerHeight-8)y=e.clientY-tip.offsetHeight-14;
  tip.style.left=x+'px';tip.style.top=y+'px'}});
document.addEventListener('mouseout',e=>{if(!e.relatedTarget||!e.relatedTarget.closest('[data-tip]'))tip.style.opacity=0});
document.addEventListener('click',e=>{
  const n=e.target.closest('.pnav button'); if(n){S.page=n.dataset.page;S.drill=null;S.mo=null;render();return}
  const pr=e.target.closest('[data-per]'); if(pr){S.per=pr.dataset.per;S.mo=null;render();return}
  const yy=e.target.closest('[data-y]'); if(yy){S.y=+yy.dataset.y;S.mo=null;render();return}
  if(e.target.closest('#btnReset')){S.co=null;S.mo=null;S.per='FY';render();return}
  if(e.target.closest('#btnBack')){S.page=S.from;S.drill=null;render();return}
  const f=e.target.closest('[data-f]');
  if(f){const[k,v]=f.dataset.f.split(':');
    if(k==='mo'){S.mo=S.mo===+v?null:+v}else{S[k]=S[k]===v?null:v}
    render();return}
});
document.addEventListener('contextmenu',e=>{const d=e.target.closest('[data-drill]'); if(!d)return;
  e.preventDefault(); S.from=S.page==='drl'?S.from:S.page;
  S.drill=d.dataset.drill.split(':')[1]; S.page='drl'; tip.style.opacity=0; render()});
function fit(){const st=$('#stage'),cv=$('#canvas');
  cv.style.transform='scale('+Math.min(st.clientWidth/1280,st.clientHeight/720)+')'}
addEventListener('resize',fit); render(); fit();
</script>
</body>
</html>
